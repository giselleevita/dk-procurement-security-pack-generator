services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dkpack}
      POSTGRES_USER: ${POSTGRES_USER:-dkpack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dkpack}
    volumes:
      - pg_data:/var/lib/postgresql/data

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://dkpack:dkpack@db:5432/dkpack}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      - db
    ports:
      - "8000:8000"

  web:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /web
    command: sh -lc "npm ci --no-audit --no-fund && npm run build && npm run preview -- --host 0.0.0.0 --port 4173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/web
      - web_node_modules:/web/node_modules
    depends_on:
      - api
    ports:
      - "4173:4173"

volumes:
  pg_data:
  web_node_modules:
